name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "デプロイ先"
        required: true
        default: "vercel"
        type: choice
        options:
          - vercel
          # - flyio  # fly.io移行後に追加
          # - both   # fly.io移行後に追加

jobs:
  deploy-vercel:
    if: inputs.target == 'vercel' || inputs.target == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
          echo "✅ Vercel deploy triggered!"

