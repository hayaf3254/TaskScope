services:
  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      # コンテナ内から見た api はサービス名で引ける
      API_ORIGIN: "http://api:3001"
      # ホットリロード用（Windows + Docker環境）
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      target: dev
    ports:
      - "3001:3001"
    env_file:
      - ../apps/api/.env
    environment:
      # ホットリロード用（Windows + Docker環境）
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../apps/api:/app
      - api_node_modules:/app/node_modules

volumes:
  web_node_modules:
  api_node_modules:
