name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "デプロイ先"
        required: true
        default: "both"
        type: choice
        options:
          - vercel
          - flyio
          - both

jobs:
  deploy-vercel:
    if: inputs.target == 'vercel' || inputs.target == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
          echo "✅ Vercel deploy triggered!"

  deploy-flyio:
    if: inputs.target == 'flyio' || inputs.target == 'both'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: |
          flyctl deploy --config apps/api/fly.toml --remote-only
          echo "✅ Fly.io deploy completed!"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
